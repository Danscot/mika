# /etc/nginx/sites-available/mika
# Nginx reverse proxy in front of Gunicorn
#
# Install:
#   sudo cp deploy/nginx/mika.conf /etc/nginx/sites-available/mika
#   sudo ln -s /etc/nginx/sites-available/mika /etc/nginx/sites-enabled/mika
#   sudo nginx -t && sudo systemctl reload nginx

upstream mika_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name _;          # Replace with your domain or EC2 public IP

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # ── Static files — served by nginx directly (no Django overhead) ──────────
    location /static/ {
        alias /home/ubuntu/mika/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Uploads — served by nginx ─────────────────────────────────────────────
    location /uploads/ {
        alias /home/ubuntu/mika/uploads/;
        expires 1d;
        access_log off;
    }

    # ── SSE endpoints — disable buffering so log stream works in real time ────
    location ~ ^/api/ingest/ {
        proxy_pass         http://mika_gunicorn;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Critical for SSE — disable all buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # ── Everything else → Gunicorn ────────────────────────────────────────────
    location / {
        proxy_pass         http://mika_gunicorn;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_read_timeout 120s;

        # File upload size limit (match MAX_UPLOAD_BYTES in settings.py)
        client_max_body_size 55M;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/mika-access.log;
    error_log   /var/log/nginx/mika-error.log;
}
