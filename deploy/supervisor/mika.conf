; /etc/supervisor/conf.d/mika.conf
;
; Supervisor config for Mika RAG Manager
; Equivalent of a PM2 ecosystem.config.js
;
; Install:
;   sudo cp deploy/supervisor/mika.conf /etc/supervisor/conf.d/mika.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Commands (like pm2):
;   sudo supervisorctl status          # pm2 list
;   sudo supervisorctl restart mika-web  # pm2 restart
;   sudo supervisorctl tail -f mika-web stdout  # pm2 logs
;
; Bot instances are managed dynamically by the bot_manager.py script
; which reads bots.json and writes individual supervisor configs.
; Run it after adding/removing bots in the dashboard:
;   python bot_manager.py --sync

; ── Django web dashboard (via Gunicorn) ──────────────────────────────────────
[program:mika-web]
command=/home/ubuntu/mika/venv/bin/gunicorn
    mika_project.wsgi:application
    --bind 127.0.0.1:8000
    --workers 3
    --worker-class sync
    --timeout 120
    --keep-alive 5
    --max-requests 1000
    --max-requests-jitter 100
    --access-logfile /var/log/mika/gunicorn-access.log
    --error-logfile  /var/log/mika/gunicorn-error.log
    --log-level info

directory=/home/ubuntu/mika
user=ubuntu
environment=
    DJANGO_SETTINGS_MODULE="mika_project.settings",
    DJANGO_SECRET_KEY="%(ENV_DJANGO_SECRET_KEY)s",
    GEMINI_API_KEY="%(ENV_GEMINI_API_KEY)s",
    ALLOWED_HOSTS="%(ENV_ALLOWED_HOSTS)s",
    DEBUG="false",
    INDEX_DIR="/home/ubuntu/mika/indexes",
    UPLOAD_DIR="/home/ubuntu/mika/uploads"

autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/mika/web-stdout.log
stderr_logfile=/var/log/mika/web-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

; ── Group so you can restart all bots at once ─────────────────────────────────
[group:mika-bots]
programs=
; bot programs are added dynamically by bot_manager.py
; they look like: mika-bot-a1b2c3d4
